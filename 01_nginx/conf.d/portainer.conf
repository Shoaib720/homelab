server {
  listen 443 ssl;
  server_name portainer.deploywizard.in;
  access_log  /var/log/nginx/portainer-access.log main;
  error_log /var/log/nginx/portainer-error.log error;
  location / {
    resolver 127.0.0.11 valid=30s;
    set $upstream_portainer portainer;
    proxy_pass http://$upstream_portainer:8000;
    proxy_buffering off;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
