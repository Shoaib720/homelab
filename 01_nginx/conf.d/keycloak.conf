server {
    listen 443 ssl;
    server_name keycloak.deploywizard.in keycloak.deploywizard.local;
    access_log  /var/log/nginx/keycloak-access.log main;
    error_log /var/log/nginx/keycloak-error.log error;
    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_keycloak keycloak;
        proxy_pass http://$upstream_keycloak:8080;
        # proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_set_header X-Forwarded-Port 443;
    }
}