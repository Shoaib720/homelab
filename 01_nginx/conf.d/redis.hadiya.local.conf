server {
  listen 443 ssl;
  server_name redisinsight.hadiya.local;
  access_log  /var/log/nginx/redis-access.log main;
  error_log /var/log/nginx/redis-error.log error;
  location / {
    # types {
    #     application/javascript js;
    # }
    resolver 127.0.0.11 valid=30s;
    set $upstream_redis_insight redis_insight;
    proxy_pass http://$upstream_redis_insight:8001/;
    # proxy_pass http://redis_insight:8001;
    proxy_read_timeout     900;
    proxy_set_header       Host $host;
    proxy_buffering off;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_hide_header "X-Frame-Options";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # location /static/app/ {
    
  # }
}
