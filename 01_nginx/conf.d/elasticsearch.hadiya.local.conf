server {
  listen 443 ssl;
  server_name elasticsearch.hadiya.local;
  access_log  /var/log/nginx/elasticsearch-access.log main;
  error_log /var/log/nginx/elasticsearch-error.log error;
  location / {
    resolver 127.0.0.11 valid=30s;
    set $upstream_elasticsearch elasticsearch;
    proxy_pass https://$upstream_elasticsearch:9200;
    proxy_ssl_trusted_certificate /etc/nginx/ssl/elasticsearch_http_ca.crt;
    proxy_ssl_verify off;
    proxy_buffering off;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
