deployment:
  replicas: 1
  initContainers:
    - name: volume-permissions
      image: busybox:latest
      command: ["sh", "-c", "touch /ssl-certs/acme.json; chmod -v 600 /ssl-certs/acme.json"]
      volumeMounts:
      - mountPath: /ssl-certs
        name: ssl-certs

# -- Create a default IngressClass for Traefik
ingressClass:  # @schema additionalProperties: false
  enabled: true
  isDefaultClass: true

# -- Only dashboard & healthcheck IngressRoute are supported. It's recommended to create workloads CR outside of this Chart.
ingressRoute:
  dashboard:
    enabled: false


logs:
  general:
    # -- Alternative logging levels are TRACE, DEBUG, INFO, WARN, ERROR, FATAL, and PANIC.
    level: "INFO"  # @schema enum:[TRACE,DEBUG,INFO,WARN,ERROR,FATAL,PANIC]; default: "INFO"


additionalArguments:
  # DNS Challenge
  # ---
  # Cloudflare Example:
   - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
   - --certificatesresolvers.cloudflare.acme.email=shoaibsshaikh1999@gmail.com
   - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1
   - --certificatesresolvers.cloudflare.acme.storage=/ssl-certs/acme-cloudflare.json

additionalArguments:
  - "--certificatesresolvers.cloudflare.acme.email=shoaibsshaikh1999@gmail.com"
  - "--certificatesresolvers.cloudflare.acme.storage=/ssl-certs/acme.json"
  - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
  - "--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
  - "--entrypoints.websecure.http.tls.certresolver=cloudflare"
  - "--entrypoints.websecure.http.tls.domains[0].main=deploywizard.in"
  - "--entrypoints.websecure.http.tls.domains[0].sans=*.deploywizard.in"

env:
  # Set your environment variables here...
  # 
  # DNS Challenge Credentials
  # ---
  # Cloudflare Example:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        key: apiToken
        name: cloudflare-credentials

ports:
  web:
    # redirectTo: websecure
    redirections:
      entrypoint:
        web:
          address: :80
          http:
            redirections:
              entryPoint:
                to: websecure
                scheme: https
                permanent: true
  websecure:
    tls:
      enabled: true
      certResolver: cloudflare

persistence:
  enabled: true
  name: ssl-certs
  size: 128Mi
  path: /ssl-certs
  storageClass: gp2

podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: "OnRootMismatch"