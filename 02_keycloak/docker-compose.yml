networks:
  homelab_network:
    name: homelab_network
    external: true

services:
  
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    restart: unless-stopped
    # depends_on:
    #   - keycloak_postgresql
    environment:
      # Bootstrap admin (first run only)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-Kc@dm!n&751}

      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-P@ssw0rd}

      # Hostname v2 (USE THESE — drop the *URL/*ADMIN_URL v1 vars)
      KC_HOSTNAME: https://keycloak.${DOMAIN:-deploywizard.local}
      KC_HOSTNAME_ADMIN: https://keycloak.${DOMAIN:-deploywizard.local}
      KC_HOSTNAME_STRICT: "true"

      # Reverse proxy config (required!)
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    command: ["start"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.${DOMAIN:-deploywizard.local}`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    networks:
      - homelab_network