networks:
  homelab_network:
    name: homelab_network
    external: true

services:
  # sonarqube_postgresql:
  #   image: docker.io/bitnami/postgresql:17.5.0
  #   volumes:
  #     - 'postgresql_data:/bitnami/postgresql'
  #   environment:
  #     # ALLOW_EMPTY_PASSWORD is recommended only for development.
  #     - ALLOW_EMPTY_PASSWORD=no
  #     - POSTGRESQL_USERNAME=sonarqube
  #     - POSTGRESQL_PASSWORD=Q9Cjts96us87hVw1PC8dEWZuj
  #     - POSTGRESQL_DATABASE=sonarqube
  #   networks:
  #     - homelab_network
  sonarqube:
    image: docker.io/bitnami/sonarqube:25.7.0
    volumes:
      - 'sonarqube_data:/bitnami/sonarqube'
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      - ALLOW_EMPTY_PASSWORD=no
      - SONARQUBE_USERNAME=admin
      - SONARQUBE_PASSWORD=${SQ_ADMIN_PASSWORD:-Sonarqube@123}
      - SONARQUBE_DATABASE_HOST=postgres
      - SONARQUBE_DATABASE_PORT_NUMBER=5432
      - SONARQUBE_DATABASE_USER=sonarqube
      - SONARQUBE_DATABASE_PASSWORD=${SONARQUBE_DATABASE_PASSWORD}
      - SONARQUBE_DATABASE_NAME=sonarqube
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarqube.rule=Host(`sonarqube.${DOMAIN:-deploywizard.local}`)"
      - "traefik.http.routers.sonarqube.entrypoints=websecure"
      - "traefik.http.routers.sonarqube.tls=true"
      - "traefik.http.services.sonarqube.loadbalancer.server.port=9000"
    networks:
      - homelab_network
volumes:
  sonarqube_data:
    driver: local