jenkins:
  securityRealm:
    oic:
      clientId: "jenkins"
      clientSecret: "${OIDC_CLIENT_SECRET}"
      serverConfiguration:
        wellKnown:
          wellKnownOpenIDConfigurationUrl: "https://keycloak.deploywizard.in/realms/HomeLab/.well-known/openid-configuration"
      emailFieldName: "email"
      userNameField: "preferred_username"
      logoutFromOpenidProvider: true
      disableSslVerification: true   # only if using HTTP in homelab
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
