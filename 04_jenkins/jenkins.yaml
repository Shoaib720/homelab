jenkins:
  securityRealm:
    oic:
      clientId: "jenkins"
      clientSecret: "${OIDC_CLIENT_SECRET}"
      serverConfiguration:
        wellKnown:
          wellKnownOpenIDConfigurationUrl: "https://keycloak.deploywizard.in/realms/HomeLab/.well-known/openid-configuration"
          scopesOverride: "openid profile email jenkins"
      emailFieldName: "email"
      groupsFieldName: "roles"
      userNameField: "preferred_username"
      logoutFromOpenidProvider: true
      disableSslVerification: true   # only if using HTTP in homelab
  authorizationStrategy:
    globalMatrix:
      permissions:
        - "Overall/Administer:jenkins-admin"
        - "Overall/Read:jenkins-readonly"
        - "Job/Build:jenkins-admin"
        - "Job/Configure:jenkins-admin"
        - "Job/Discover:jenkins-readonly"
