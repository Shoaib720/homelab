networks:
  homelab_network:
    name: homelab_network
    external: true

services:
  gitlab:
    image: gitlab/gitlab-ce:18.0.5-ce.0
    ports:
      - 8081:80
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.deploywizard.in'
    volumes:
      - 'gitlab_configs:/etc/gitlab'
      - 'gitlab_logs:/var/log/gitlab'
      - 'gitlab_data:/var/opt/gitlab'
    shm_size: '512m'
    networks:
      - homelab_network
volumes:
  gitlab_data:
    driver: local
  gitlab_logs:
    driver: local
  gitlab_configs:
    driver: local