name: Nonprod - persistent provisioner

on:
  workflow_dispatch:

jobs:
  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    environment: DEV
    env:
      TF_WORKDIR: ./infra/envs/nonprod/persistent
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true
          format: sarif
          additional_args: --force-all-dirs ${{ env.TF_WORKDIR }} --out tfsec-results.sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec-results.sarif