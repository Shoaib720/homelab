name: Provision Homelab EKS

on:
  workflow_dispatch:

jobs:
  infrastructure:
    name: Provision Infrastructure with Terragrunt
    runs-on: ubuntu-latest
    environment: DEV

    env:
      AWS_REGION: ap-south-1
      TG_WORKDIR: ./infra/envs/nonprod   # adjust to your terragrunt.hcl path

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Install Terraform & Terragrunt
        run: |
          curl -Lo /usr/local/bin/terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v0.66.4/terragrunt_linux_amd64
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terragrunt Init - VPC
        run: terragrunt init
        working-directory: ${{ env.TG_WORKDIR }}/vpc

      - name: Terragrunt Plan - VPC
        run: terragrunt plan -out=tfplan
        working-directory: ${{ env.TG_WORKDIR }}/vpc

      - name: Terragrunt Apply - VPC
        run: terragrunt apply -auto-approve tfplan
        working-directory: ${{ env.TG_WORKDIR }}/vpc

