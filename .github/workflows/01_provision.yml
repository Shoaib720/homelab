name: Provision Homelab EKS

on:
  workflow_dispatch:

jobs:
  infrastructure:
    name: Provision
    runs-on: ubuntu-latest
    environment: DEV

    env:
      AWS_REGION: ap-south-1
      TG_WORKDIR: ./infra/envs/nonprod   # adjust to your terragrunt.hcl path

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Install Terragrunt
        run: |
          curl -Lo /usr/local/bin/terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v0.66.4/terragrunt_linux_amd64
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terragrunt Init - VPC
        run: terragrunt init --terragrunt-disable-bucket-update
        working-directory: ${{ env.TG_WORKDIR }}/vpc

      - name: Terragrunt Plan - VPC
        run: terragrunt plan -out=vpc.tfplan
        working-directory: ${{ env.TG_WORKDIR }}/vpc

      - name: Terragrunt Apply - VPC
        run: terragrunt apply -auto-approve vpc.tfplan
        working-directory: ${{ env.TG_WORKDIR }}/vpc

      - name: Terragrunt Init - EKS
        run: terragrunt init --terragrunt-disable-bucket-update
        working-directory: ${{ env.TG_WORKDIR }}/eks

      - name: Terragrunt Plan - EKS
        run: terragrunt plan -out=eks.tfplan
        working-directory: ${{ env.TG_WORKDIR }}/eks

      - name: Terragrunt Apply - EKS
        run: terragrunt apply -auto-approve eks.tfplan
        working-directory: ${{ env.TG_WORKDIR }}/eks

      - name: Export Kubeconfig
        run: |
          CLUSTER_NAME=$(terragrunt output -raw cluster_name)
          aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME
          mkdir -p ~/.kube
          cp ~/.kube/config kubeconfig
        working-directory: ${{ env.TG_WORKDIR }}/eks

      - name: Upload kubeconfig artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubeconfig
          path: ${{ env.TG_WORKDIR }}/eks/kubeconfig
          retention-days: 3

