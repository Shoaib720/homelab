networks:
  homelab_network:
    name: homelab_network
    external: true

services:
  vault:
    image: hashicorp/vault:1.13.3
    container_name: vault
    restart: unless-stopped
    networks:
      - homelab_network
    # Expose API and cluster ports
    ports:
      - "8200:8200"
      - "8201:8201"

    # Persist Raft data and provide config
    volumes:
      - ./vault.hcl:/vault/config/vault.hcl:ro
      - vault-raft-data:/vault/data

    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_API_ADDR: "http://0.0.0.0:8200"
      VAULT_CLUSTER_ADDR: "http://0.0.0.0:8201"

    cap_add:
      - IPC_LOCK

    command: >
      vault server
      -config=/vault/config/vault.hcl

volumes:
  vault-raft-data:
