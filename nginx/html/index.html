<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homelab Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f2f5;
      padding-top: 50px;
    }
    .logo-card {
      text-align: center;
      padding: 20px;
      border-radius: 12px;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      color: inherit;
      height: 230px; /* Fixed height for all cards */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .logo-card:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    .logo-img-wrapper {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-img {
      max-height: 100px;
      max-width: 100%;
      height: auto;
      width: auto;
    }
    .logo-name {
      font-size: 1.2rem;
      font-weight: 500;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center mb-5">Shoaib's Homelab</h2>
    <div class="row justify-content-center g-4">
      
      <!-- Jenkins -->
      <div class="col-6 col-sm-4 col-md-3">
        <a href="http://jenkins.deploywizard.in" class="logo-card d-block">
          <div class="logo-img-wrapper">
            <img src="https://www.jenkins.io/images/logos/jenkins/jenkins.png" alt="Jenkins" class="logo-img">
          </div>
          <div class="logo-name">Jenkins</div>
        </a>
      </div>

      <!-- Example: Keycloak -->
      <div class="col-6 col-sm-4 col-md-3">
        <a href="http://keycloak.deploywizard.in" class="logo-card d-block">
          <div class="logo-img-wrapper">
            <img src="https://www.e-time.it/wp-content/uploads/2022/03/Keycloak_logo-300x200.webp" alt="Keycloak" class="logo-img">
          </div>
          <div class="logo-name">Keycloak</div>
        </a>
      </div>

      <div class="col-6 col-sm-4 col-md-3">
        <a href="http://sonarqube.deploywizard.in" class="logo-card d-block">
          <div class="logo-img-wrapper">
            <img src="https://www.actency.fr/sites/default/files/styles/logo_lg_350x140/public/images/node/technology/logo/sonarQube.png.webp" alt="Keycloak" class="logo-img">
          </div>
          <div class="logo-name">SonarQube</div>
        </a>
      </div>

    </div>
  </div>
</body>
</html>
