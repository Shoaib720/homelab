<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homelab Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .card {
      transition: transform 0.2s ease;
    }
    .card:hover {
      transform: scale(1.02);
    }
    .card a {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-4">🏠 Shoaib's Homelab Dashboard</h1>
    <div class="row row-cols-1 row-cols-md-3 g-4">
      
      <!-- Jenkins -->
      <div class="col">
        <div class="card h-100 text-center shadow">
          <div class="card-body">
            <h5 class="card-title">🔧 Jenkins</h5>
            <p class="card-text">CI/CD automation server</p>
            <a href="http://jenkins.deploywizard.in" class="btn btn-primary" target="_blank">Open</a>
          </div>
        </div>
      </div>

      <!-- Keycloak -->
      <div class="col">
        <div class="card h-100 text-center shadow">
          <div class="card-body">
            <h5 class="card-title">🔐 Keycloak</h5>
            <p class="card-text">Identity and access management</p>
            <a href="http://keycloak.deploywizard.in" class="btn btn-primary" target="_blank">Open</a>
          </div>
        </div>
      </div>

      <!-- Add more tools below -->
      <!-- Example: -->
      <!-- <div class="col"> ... </div> -->

    </div>
  </div>
</body>
</html>
