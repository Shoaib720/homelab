networks:
  homelab_network:
    name: homelab_network
    external: true

services:
  nginx:
    container_name: nginx
    restart: unless-stopped
    image: nginx:1.29
    volumes:
      - ./conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./html:/usr/share/nginx/html:ro
    ports:
      - 80:80
      - 443:443
    networks:
      - homelab_network